[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-cost-audit"
version = "0.1.0"
description = "Read-only AWS cost audit: Cost Explorer baseline, utilization-proven idle resources, tiered savings plan."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yeluru Sreenivasulu" }]
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aws-cost-audit = "aws_cost_audit.cli:main"

[tool.setuptools]
packages = ["aws_cost_audit"]
